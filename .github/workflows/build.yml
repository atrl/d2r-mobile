name: Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DM_ANDROID_TOOLS: ${{ github.workspace }}/.tools/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install lz4==4.4.4 capstone==5.0.7 unicorn==2.1.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DM_ANDROID_TOOLS }}
          key: android-tools-${{ runner.os }}-${{ hashFiles('dm/android/tools/bootstrap.py', 'dm/android/tools/build_gpu_driver.py') }}
      - run: python3 dm/android/tools/bootstrap.py
      - run: python3 dm/android/tools/ci_checks.py
      - name: Configure version
        run: |
          echo "APK_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "APK_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: github.ref_type != 'tag'
        run: python3 dm/android/tools/build.py --game-run --version "ci-${GITHUB_SHA::8}" --version-code "$APK_CODE"
      - name: Build signed release APK
        if: github.ref_type == 'tag'
        env:
          D2R_KEYSTORE_BASE64: ${{ secrets.D2R_KEYSTORE_BASE64 }}
          D2R_KEY_ALIAS: d2r-release
          D2R_STORE_PASSWORD: ${{ secrets.D2R_STORE_PASSWORD }}
          D2R_KEY_PASSWORD: ${{ secrets.D2R_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export D2R_KEYSTORE="$RUNNER_TEMP/d2r-release.p12"
          trap 'rm -f "$D2R_KEYSTORE"' EXIT
          test -n "$D2R_KEYSTORE_BASE64"
          printf '%s' "$D2R_KEYSTORE_BASE64" | base64 --decode > "$D2R_KEYSTORE"
          chmod 600 "$D2R_KEYSTORE"
          python3 dm/android/tools/build.py --game-run --release --version "$APK_VERSION" --version-code "$APK_CODE"
      - name: Verify and package
        run: |
          export JAVA_HOME="$DM_ANDROID_TOOLS/jdk"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$DM_ANDROID_TOOLS/build-tools/apksigner" verify --verbose --print-certs dm/android/build/D2R-Android-port.apk > dm/android/build/signature.txt
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 dm/android/tools/verify_apk.py dm/android/build/D2R-Android-port.apk --release
          else
            python3 dm/android/tools/verify_apk.py dm/android/build/D2R-Android-port.apk
          fi
          python3 dm/android/tools/make_kit.py --version "${APK_VERSION//\//-}"
          cp dm/android/build/D2R-Android-port.apk dist/
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cp dm/android/build/D2R-Android-port.apk "dist/D2R-Android-${APK_VERSION}-arm64.apk"
          fi
          cp dm/android/build/signature.txt dist/
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d2r-android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: d2r-android-${{ github.run_number }}
          path: dist
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          **首次安装：下载下方带版本号、以 `-arm64.apk` 结尾的安装包。**
          请使用手机浏览器完成下载，再到手机“文件管理 → 下载”打开 APK；如系统询问，请允许该来源安装应用。不要在聊天窗口中预览安装包。
          `D2R-Android-port.apk` 是内容相同的更新兼容入口，两个 APK 只需下载一个。ZIP、SHA256SUMS 和 signature.txt 都不是安装包。
          preview.14：修正切换场景后备用按钮自动消失，展开/收起状态改为由玩家控制并保存。游戏内按系统返回键打开菜单，新增“操作按钮大小”：75%、100%、125%、150%，默认100%，仅受屏幕边界限制，不再为了塞入黑边强行缩小。放大后空间不足时会覆盖画面边缘。首次使用默认展开，之后记住玩家选择。
          保留直接触摸菜单、背包、世界目标及技能/药水栏。此版本只修复控件可用性，不宣称解决vivo术士场景16 FPS/掉帧；尚待该设备的最新日志定位。
          新增“自适应宽屏”分辨率选项：宽屏按当前比例渲染；窄屏/折叠内屏保持完整16:9画面，不拉伸、不裁切。方形原生渲染在测试中触发裁剪错误，因此本版不启用。切换屏幕后重新启动可重新计算分辨率。
          新增默认关闭的“自动发送诊断”：填写私下提供的调试接收地址并开启后，每30秒上传设备信息和近期日志，可随时关闭，不传存档或游戏资源；日志可能含角色名和本地路径。进程崩溃后需重开启动器才能补传，临时通道重启后地址需更新。
          vivo V2436A用户已确认preview.12内置Turnip可运行，系统驱动仍会退出。已有subgroup64兼容补丁请保留，继续使用内置Turnip；无需重新下载补丁或游戏数据。
          首次安装：在启动器选择“下载游戏数据”，约6.15 GB，预留13 GB空间。支持最多四连接、速率显示、续传和SHA-256校验。APK与数据独立更新，覆盖安装保留数据/存档；“检查GitHub更新”支持预览版。数据引用preview.5固定资源，需保留该发布。
          验证：28组Linux检查通过，含33项公共触摸回归断言；Android15模拟器已通过触摸进入营地、点传送点走近并交互、药水栏命中。vivo真机的新触屏交互、折叠切换、温控和完整战斗仍需验证。
          Download the versioned arm64 APK and install over the existing app. No game-data redownload is needed. Touch uses the shared menu/inventory/world adapter; optional controls collapse into an edge entry. Inner screens preserve the full picture with letterboxing. Automatic diagnostics is opt-in. Real vivo touch/fold acceptance remains pending.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "D2R Android $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" dist/*
