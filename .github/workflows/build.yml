name: Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DM_ANDROID_TOOLS: ${{ github.workspace }}/.tools/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install lz4==4.4.4 capstone==5.0.7 unicorn==2.1.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DM_ANDROID_TOOLS }}
          key: android-tools-${{ runner.os }}-${{ hashFiles('dm/android/tools/bootstrap.py', 'dm/android/tools/build_gpu_driver.py') }}
      - run: python3 dm/android/tools/bootstrap.py
      - run: python3 dm/android/tools/ci_checks.py
      - name: Configure version
        run: |
          echo "APK_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "APK_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build debug APK
        if: github.ref_type != 'tag'
        run: python3 dm/android/tools/build.py --game-run --version "ci-${GITHUB_SHA::8}" --version-code "$APK_CODE"
      - name: Build signed release APK
        if: github.ref_type == 'tag'
        env:
          D2R_KEYSTORE_BASE64: ${{ secrets.D2R_KEYSTORE_BASE64 }}
          D2R_KEY_ALIAS: d2r-release
          D2R_STORE_PASSWORD: ${{ secrets.D2R_STORE_PASSWORD }}
          D2R_KEY_PASSWORD: ${{ secrets.D2R_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export D2R_KEYSTORE="$RUNNER_TEMP/d2r-release.p12"
          trap 'rm -f "$D2R_KEYSTORE"' EXIT
          test -n "$D2R_KEYSTORE_BASE64"
          printf '%s' "$D2R_KEYSTORE_BASE64" | base64 --decode > "$D2R_KEYSTORE"
          chmod 600 "$D2R_KEYSTORE"
          python3 dm/android/tools/build.py --game-run --release --version "$APK_VERSION" --version-code "$APK_CODE"
      - name: Verify and package
        run: |
          export JAVA_HOME="$DM_ANDROID_TOOLS/jdk"
          export PATH="$JAVA_HOME/bin:$PATH"
          "$DM_ANDROID_TOOLS/build-tools/apksigner" verify --verbose --print-certs dm/android/build/D2R-Android-port.apk > dm/android/build/signature.txt
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 dm/android/tools/verify_apk.py dm/android/build/D2R-Android-port.apk --release
          else
            python3 dm/android/tools/verify_apk.py dm/android/build/D2R-Android-port.apk
          fi
          python3 dm/android/tools/make_kit.py --version "${APK_VERSION//\//-}"
          cp dm/android/build/D2R-Android-port.apk dist/
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            cp dm/android/build/D2R-Android-port.apk "dist/D2R-Android-${APK_VERSION}-arm64.apk"
          fi
          cp dm/android/build/signature.txt dist/
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d2r-android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: d2r-android-${{ github.run_number }}
          path: dist
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          **首次安装：下载下方带版本号、以 `-arm64.apk` 结尾的安装包。**
          请使用手机浏览器完成下载，再到手机“文件管理 → 下载”打开 APK；如系统询问，请允许该来源安装应用。不要在聊天窗口中预览安装包。
          `D2R-Android-port.apk` 是内容相同的更新兼容入口，两个 APK 只需下载一个。ZIP、SHA256SUMS 和 signature.txt 都不是安装包。
          本版数据下载最多使用四个并发连接并显示实时速率，保留已有分卷续传和 SHA-256 校验；本机小块采样四连接快于串行，但不保证手机上的提速倍数。保留选角菜单点击修正、小数百分比、已下载 MiB 及连接/重试/校验状态。GitHub 网络不可达仍需排查；vivo 实机尚未验证。
          新增“启动错误与诊断 → 导出诊断报告”，可导出设备型号、Android 退出记录、启动配置和游戏日志尾部。若启动后返回设置，请先导出报告；此版提供故障取证，不宣称已修复 vivo 启动退出。覆盖安装后无需重新下载数据。
          vivo V2436A / Android 16 的日志确认：系统 Adreno 750 驱动使用 subgroup64，原数据包使用 subgroup32，启动因此主动中止。本版新增“修复系统驱动兼容性”，仅下载约 142 MB 的匹配着色器补丁并保留现有游戏与存档。安装补丁后使用系统驱动再启动；无需重新下载 6 GB 数据。所有 6931 个补丁着色器已校验，真实 vivo 运行仍待复测。
          preview.12：已装兼容补丁时，内置 Turnip 改用显式 subgroup64（vivo 实测该驱动范围64..128，不支持32）。系统驱动已通过子组校验但后续出现 SIGSEGV，根因尚待崩溃地址映射确认。本版支持切换 Turnip 对照，并保留最近三次日志及崩溃地址所属库。已有补丁无需重下；不宣称已验证 vivo 可以游戏。
          首次安装仍需选择“下载游戏数据”。
          应用直接从 GitHub 下载约 6.15 GB 数据，逐卷校验 SHA-256 并自动导入；无需电脑或手动合并。首次安装请预留 13 GB 空间，建议使用 Wi-Fi 并保持应用在前台。下载中断后再次点击可续传。
          APK 与数据独立更新，覆盖安装 APK 保留已导入的数据。启动器内“检查 GitHub 更新”支持本仓库的预览版。
          数据引用 preview.5 的固定校验版本，因此该发布需保留；打包工具 ZIP 是开发工具，普通安装无需下载。
          **兼容性测试版：已在 Android 模拟器创建角色、进入营地并验证摇杆移动；战斗、vivo 折叠屏实机和温控测试仍未完成。**
          Android 15 x86 模拟器已验证 ARM64 安装与完整数据导入；修正 NVN 计数跳板的原子指令兼容问题，对缺少写异常元数据的 x86 翻译环境关闭脏页写保护。
          Download the APK, then use Download game data in the launcher. About 6.15 GB is downloaded and imported automatically. Reserve 13 GB and keep the app in the foreground. Interrupted downloads can resume. Camp entry and touch movement work in the emulator; combat and vivo fold hardware validation remain incomplete.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "D2R Android $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" dist/*
